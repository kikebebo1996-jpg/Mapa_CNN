<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Región Centro Norte | Mapa Ejecutivo</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #006241;
      color: white;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: bold;
    }

    #controls {
      padding: 10px;
      background: white;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      z-index: 999;
      position: relative;
    }

    select, input {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    #map {
      height: calc(100vh - 118px);
      width: 100%;
    }

    .popup h3 {
      margin: 0 0 8px;
      color: #006241;
      font-size: 18px;
    }

    .section {
      margin-top: 8px;
      font-weight: bold;
      color: #333;
      border-top: 1px solid #ddd;
      padding-top: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
      margin: 3px 0;
    }

    .label {
      font-weight: bold;
      color: #444;
    }

    .value {
      color: #222;
      text-align: right;
    }
  </style>
</head>

<body>
  <header>☕ Región Centro Norte | Mapa Ejecutivo</header>

  <div id="controls">
    <input id="search" type="text" placeholder="Buscar tienda o CC" />

    <select id="dmFilter">
      <option value="">Todos los DM</option>
    </select>

    <select id="estadoFilter">
      <option value="">Todos los estados</option>
    </select>

    <select id="tierFilter">
      <option value="">Todos los Tier</option>
    </select>

    <select id="formatoFilter">
      <option value="">Todos los formatos</option>
    </select>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([19.50, -99.18], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'Mapa Ejecutivo Región Centro Norte'
    }).addTo(map);

    let allData = [];
    let markers = [];

    const colors = {
      "Enrique César": "#00704A",
      "Nancy Rodríguez": "#0073CF",
      "Vanessa Carreño": "#8E44AD",
      "Veronica García": "#F39C12",
      "Yazmin Chabela": "#C0392B",
      "Yazmin García": "#8D6E63"
    };

    function getColor(dm) {
      return colors[dm] || "#006241";
    }

    function addOptions(id, values) {
      const select = document.getElementById(id);
      values.sort().forEach(v => {
        if (v) {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
      });
    }

    function popupTemplate(d) {
      return `
        <div class="popup">
          <h3>${d["CC Nombre"] || ""}</h3>

          <div class="row"><span class="label">CC</span><span class="value">${d["CC"] || ""}</span></div>
          <div class="row"><span class="label">DM</span><span class="value">${d["DM"] || ""}</span></div>
          <div class="row"><span class="label">Apertura</span><span class="value">${d["Fecha de Apertura"] || ""}</span></div>
          <div class="row"><span class="label">Tier</span><span class="value">${d["TIER"] || ""}</span></div>
          <div class="row"><span class="label">Municipio</span><span class="value">${d["Municipio o Delegación"] || ""}</span></div>
          <div class="row"><span class="label">Estado</span><span class="value">${d["Estado"] || ""}</span></div>
          <div class="row"><span class="label">Formato</span><span class="value">${d["Formato"] || ""}</span></div>
          <div class="row"><span class="label">Comercial</span><span class="value">${d["Formato - Comercial"] || ""}</span></div>

          <div class="section">🤝 Partner</div>
          <div class="row"><span class="label">Rolling</span><span class="value">${d["Rolling"] || ""}</span></div>

          <div class="section">💰 Negocio</div>
          <div class="row"><span class="label">Ventas</span><span class="value">${d["Ventas"] || ""}</span></div>
          <div class="row"><span class="label">Dif ppto %</span><span class="value">${d["Dif ppto %"] || d["dif ppto%"] || ""}</span></div>
          <div class="row"><span class="label">TPLH</span><span class="value">${d["TPLH"] || ""}</span></div>
          <div class="row"><span class="label">IPLH</span><span class="value">${d["IPLH"] || ""}</span></div>
          <div class="row"><span class="label">Labor</span><span class="value">${d["Labor"] || d["Labor %"] || ""}</span></div>
          <div class="row"><span class="label">Dif Labor %</span><span class="value">${d["Dif Labor%"] || d["Dif Labor %"] || ""}</span></div>
          <div class="row"><span class="label">OMT</span><span class="value">${d["OMT #"] || ""}</span></div>
          <div class="row"><span class="label">EBITDA</span><span class="value">${d["EBITDA"] || ""}</span></div>
          <div class="row"><span class="label">Dif EBITDA</span><span class="value">${d["Dif EBITDA %"] || d["dif EBITDA %"] || ""}</span></div>

          <div class="section">☕ Cliente</div>
          <div class="row"><span class="label">NPS</span><span class="value">${d["NPS"] || ""}</span></div>
          <div class="row"><span class="label">Conexión</span><span class="value">${d["Conexión"] || ""}</span></div>
          <div class="row"><span class="label">Bebida</span><span class="value">${d["Bebida"] || ""}</span></div>
          <div class="row"><span class="label">CTC</span><span class="value">${d["CTC"] || ""}</span></div>

          <div class="section">🚗 Drive Thru</div>
          <div class="row"><span class="label">DT Time</span><span class="value">${d["DT Time"] || "N/A"}</span></div>
          <div class="row"><span class="label">DT AA</span><span class="value">${d["Tiempo DT AA"] || "N/A"}</span></div>

          <div class="section">📅 Corte</div>
          <div class="row"><span class="label">YTD</span><span class="value">${d["Corte YTD"] || ""}</span></div>
        </div>
      `;
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function renderMap() {
      clearMarkers();

      const search = document.getElementById("search").value.toLowerCase();
      const dm = document.getElementById("dmFilter").value;
      const estado = document.getElementById("estadoFilter").value;
      const tier = document.getElementById("tierFilter").value;
      const formato = document.getElementById("formatoFilter").value;

      const filtered = allData.filter(d => {
        return (!search || 
          String(d["CC Nombre"]).toLowerCase().includes(search) ||
          String(d["CC"]).toLowerCase().includes(search)
        )
        && (!dm || d["DM"] === dm)
        && (!estado || d["Estado"] === estado)
        && (!tier || d["TIER"] === tier)
        && (!formato || d["Formato"] === formato);
      });

      filtered.forEach(d => {
        const lat = parseFloat(d["Latitud"]);
        const lng = parseFloat(d["Longitud"]);

        if (!isNaN(lat) && !isNaN(lng)) {
          const marker = L.circleMarker([lat, lng], {
            radius: 8,
            color: getColor(d["DM"]),
            fillColor: getColor(d["DM"]),
            fillOpacity: 0.9,
            weight: 2
          }).addTo(map);

          marker.bindPopup(popupTemplate(d));
          markers.push(marker);
        }
      });
    }

    Papa.parse("data.csv", {
      download: true,
      header: true,
      complete: function(results) {
        allData = results.data.filter(d => d["Latitud"] && d["Longitud"]);

        addOptions("dmFilter", [...new Set(allData.map(d => d["DM"]))]);
        addOptions("estadoFilter", [...new Set(allData.map(d => d["Estado"]))]);
        addOptions("tierFilter", [...new Set(allData.map(d => d["TIER"]))]);
        addOptions("formatoFilter", [...new Set(allData.map(d => d["Formato"]))]);

        renderMap();
      }
    });

    document.querySelectorAll("select, input").forEach(el => {
      el.addEventListener("input", renderMap);
      el.addEventListener("change", renderMap);
    });
  </script>
</body>
</html>
